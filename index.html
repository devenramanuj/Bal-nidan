<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>બાળ નિદાન Pro - 2.5 Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; user-select: none; }
        #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; display: none; }
        #silent-video { display: block; }
        #camera-feed { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 5; border: 5px solid #00ff88; }
        canvas { display: none; }
        .header-title { position: fixed; top: 15px; left: 20px; z-index: 20; color: #00ff88; font-weight: bold; font-size: 20px; text-shadow: 0 0 10px rgba(0,255,136,0.5); }
        .side-btn { position: fixed; top: 20px; right: 20px; z-index: 20; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; padding: 20px; box-sizing: border-box; justify-content: center; align-items: center; }
        .settings-box { background: #1a1a1a; padding: 25px; border-radius: 20px; width: 90%; max-width: 350px; border: 1px solid #00ff88; color: white; text-align: center; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 10px; }
        .save-btn { width: 100%; padding: 12px; background: #00ff88; border: none; font-weight: bold; cursor: pointer; color: #000; border-radius: 10px; }
        #controls-container { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; align-items: center; width: 100%; }
        #status-text { color: white; margin-bottom: 20px; font-size: 14px; background: rgba(0,255,136,0.2); padding: 8px 20px; border-radius: 25px; border: 1px solid #00ff88; backdrop-filter: blur(10px); }
        .btn-row { display: flex; gap: 15px; align-items: center; }
        .action-btn { width: 55px; height: 55px; border-radius: 50%; border: none; color: white; font-size: 22px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #scan-btn { width: 75px; height: 75px; background: #00ff88; color: #000; font-size: 28px; }
        #pdf-btn { background: #ff9f00; display: none; }
        #stop-btn { background: #ff3b30; }
    </style>
</head>
<body>

    <div class="header-title">બાળ નિદાન Pro</div>

    <div id="video-container">
        <video id="silent-video" autoplay muted loop playsinline><source src="silent.mp4" type="video/mp4"></video>
        <video id="talking-video" muted loop playsinline><source src="talking.mp4" type="video/mp4"></video>
        <video id="thinking-video" muted loop playsinline><source src="thinking.mp4" type="video/mp4"></video>
        <video id="smiling-video" muted loop playsinline><source src="smiling.mp4" type="video/mp4"></video>
    </div>
    
    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="canvas-capture"></canvas>
    <input type="file" id="gallery-input" accept="image/*" style="display:none" onchange="handleGalleryUpload(event)">

    <button class="side-btn" onclick="openSettings()"><i class="fas fa-cog"></i></button>

    <div id="settings-modal" class="modal">
        <div class="settings-box">
            <h3>બાળ નિદાન સેટિંગ્સ</h3>
            <input type="text" id="userNameInput" placeholder="તમારું નામ">
            <div style="text-align: left; font-size: 12px; margin-bottom: 5px; color: #00ff88;">Working Models Only:</div>
            
            <select id="flashModelSelect">
                <option value="gemini-2.5-flash">Gemini 2.5 Flash ⚡</option>
                <option value="gemini-2.0-flash">Gemini 2.0 Flash 🚀</option>
            </select>
            
            <select id="proModelSelect">
                <option value="gemini-2.5-pro">Gemini 2.5 Pro 🔥</option>
                <option value="gemini-3.0-flash">Gemini 3.0 Flash 🌟</option>
            </select>
            
            <textarea id="geminiKeyInput" rows="3" placeholder="API Keys અહીં પેસ્ટ કરો..."></textarea>
            <button class="save-btn" onclick="saveSettings()">સેવ કરો</button>
        </div>
    </div>

    <div id="controls-container">
        <div id="status-text">સ્કેન કરવા માટે બટન દબાવો</div>
        <div class="btn-row">
            <button id="gallery-btn" class="action-btn" style="background:#008cff" title="ગેલેરી" onclick="document.getElementById('gallery-input').click()"><i class="fas fa-images"></i></button>
            <button id="scan-btn" class="action-btn" title="સ્કેન કરો" onclick="activateScan()"><i class="fas fa-notes-medical"></i></button>
            <button id="pdf-btn" class="action-btn" title="PDF રિપોર્ટ" onclick="generatePDF()"><i class="fas fa-file-pdf"></i></button>
            <button id="stop-btn" class="action-btn" title="અવાજ બંધ" onclick="stopSpeech()"><i class="fas fa-volume-mute"></i></button>
        </div>
    </div>

    <script>
        let userName = localStorage.getItem('bn_user') || "સાહેબ"
        let apiKey = localStorage.getItem('bn_key') || ""
        let flashModel = localStorage.getItem('bn_flash_model') || "gemini-2.5-flash"
        let proModel = localStorage.getItem('bn_pro_model') || "gemini-2.5-pro"
        let lastReport = ""

        const videos = { silent: document.getElementById('silent-video'), talking: document.getElementById('talking-video'), thinking: document.getElementById('thinking-video'), smiling: document.getElementById('smiling-video') }
        const statusText = document.getElementById('status-text')
        const cameraFeed = document.getElementById('camera-feed')
        const canvas = document.getElementById('canvas-capture')

        window.onload = () => {
            playVideo('smiling')
            setTimeout(() => { speak(`જય શ્રી કૃષ્ણ ${userName} હવે મેં ૧.૫ મોડેલ દૂર કરી દીધા છે અને માત્ર વર્કિંગ મોડેલ રાખ્યા છે`) }, 1000)
        }

        function playVideo(type) {
            Object.values(videos).forEach(v => { v.style.display = 'none'; v.pause() })
            if(videos[type]) { videos[type].style.display = 'block'; videos[type].play().catch(()=>{}) }
        }

        function speak(text) {
            window.speechSynthesis.cancel()
            let clean = text.replace(/[.,!?;:*#_]/g, "") 
            const u = new SpeechSynthesisUtterance(clean)
            u.lang = 'gu-IN'
            u.rate = 0.75
            u.onstart = () => playVideo('talking')
            u.onend = () => { playVideo('smiling'); setTimeout(() => playVideo('silent'), 3000) }
            window.speechSynthesis.speak(u)
        }

        function stopSpeech() { window.speechSynthesis.cancel(); playVideo('silent') }

        async function activateScan() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                cameraFeed.srcObject = stream
                cameraFeed.style.display = 'block'
                statusText.innerText = "બાળકનો ફોટો લો"
                document.getElementById('scan-btn').onclick = capturePhoto
                speak("બાળકની આંખો અથવા નખનો ફોટો પાડો")
            } catch(e) { alert("કેમેરા પરમિશન જરૂરી છે") }
        }

        async function capturePhoto() {
            canvas.width = cameraFeed.videoWidth; canvas.height = cameraFeed.videoHeight
            canvas.getContext('2d').drawImage(cameraFeed, 0, 0)
            cameraFeed.srcObject.getTracks().forEach(t => t.stop())
            cameraFeed.style.display = 'none'
            document.getElementById('scan-btn').onclick = activateScan
            
            playVideo('thinking')
            statusText.innerText = "પ્રો મોડેલ વિશ્લેષણ કરી રહ્યું છે"
            const base64Image = canvas.toDataURL('image/jpeg', 0.5).split(',')[1]
            await askGemini(base64Image, true) 
        }

        function handleGalleryUpload(e) {
            const file = e.target.files[0]
            const reader = new FileReader()
            reader.onload = async (event) => {
                const base64 = event.target.result.split(',')[1]
                playVideo('thinking')
                await askGemini(base64, true)
            }
            reader.readAsDataURL(file)
        }

        async function askGemini(base64, isAnalysis = false) {
            if(!apiKey) return speak("સેટિંગ્સમાં એ પી આઈ કી ઉમેરો")
            
            const selectedModel = isAnalysis ? proModel : flashModel
            const prompt = isAnalysis ? 
                "તું એક અનુભવી ડૉક્ટર છે આ ફોટા પરથી બાળકની આંખો અને નખની સ્થિતિ તપાસીને ગુજરાતીમાં નિદાન આપ અને પોષણ માટે આહારની સલાહ આપ" : 
                "ગુજરાતીમાં ટૂંકું અભિવાદન કર"
            
            try {
                const keys = apiKey.split(',').map(k => k.trim())
                const key = keys[Math.floor(Math.random() * keys.length)]
                
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${key}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64 } }] }] })
                })
                const data = await res.json()
                
                if(data.error) {
                    speak("આ કી સાથે મોડેલ ચાલતું નથી કૃપા કરીને બીજી કી તપાસો")
                    return
                }

                lastReport = data.candidates[0].content.parts[0].text
                speak(lastReport)
                if(isAnalysis) document.getElementById('pdf-btn').style.display = 'flex'
                statusText.innerText = "નિદાન પૂરું થયું"
            } catch(e) { speak("ક્ષમા કરજો અત્યારે પ્રોસેસ કરવામાં તકલીફ છે") }
        }

        function generatePDF() {
            const { jsPDF } = window.jspdf
            const doc = new jsPDF()
            doc.text("Child Health Report", 20, 20)
            const splitText = doc.splitTextToSize(lastReport, 170)
            doc.text(splitText, 20, 40)
            doc.save(`Report_${new Date().getTime()}.pdf`)
            speak("પી ડી એફ સેવ થઈ ગઈ છે")
        }

        function openSettings() { 
            document.getElementById('settings-modal').style.display = 'flex'
            document.getElementById('userNameInput').value = userName
            document.getElementById('geminiKeyInput').value = apiKey
            document.getElementById('flashModelSelect').value = flashModel
            document.getElementById('proModelSelect').value = proModel
        }
        function saveSettings() {
            localStorage.setItem('bn_user', document.getElementById('userNameInput').value)
            localStorage.setItem('bn_key', document.getElementById('geminiKeyInput').value)
            localStorage.setItem('bn_flash_model', document.getElementById('flashModelSelect').value)
            localStorage.setItem('bn_pro_model', document.getElementById('proModelSelect').value)
            location.reload()
        }
    </script>
</body>
</html>
